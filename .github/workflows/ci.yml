name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install ripgrep (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y --no-progress
      - run: npm test
      - run: npm run preflight
      - name: Package and smoke-test the final release ZIP in isolation
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'helioterm-release-smoke'
          if (Test-Path -LiteralPath $smokeRoot) { Remove-Item -LiteralPath $smokeRoot -Recurse -Force }
          git clone --no-hardlinks $env:GITHUB_WORKSPACE $smokeRoot
          git -C $smokeRoot switch --force-create main
          & (Join-Path $smokeRoot 'scripts\package-release.ps1') -OutputDirectory (Join-Path $smokeRoot 'dist')
          if ($LASTEXITCODE -ne 0) { throw 'Clean-clone release packaging smoke failed.' }
